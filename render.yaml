services:
  - type: web
    name: mfs-video-studio
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: COOKIE_SECURE
        value: "true"
      - key: RENDER_WIDTH
        value: "540"
      - key: RENDER_FPS
        value: "15"
      - key: PANEL_PASSWORD
        generateValue: true
